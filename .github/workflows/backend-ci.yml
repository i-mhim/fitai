name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fitai
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: fitai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fitai -d fitai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fitai:ci_only_password@localhost:5432/fitai
      FITAI_JWT_SECRET: testing-only-ci-secret-long-enough-for-hs256-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: Run all tests (isolated SQLite per test run)
        run: python -m pytest -q
