services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitai
      POSTGRES_PASSWORD: fitai_local_dev_only
      POSTGRES_DB: fitai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fitai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitai -d fitai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fitai_postgres:
